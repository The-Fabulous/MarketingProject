<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка аудио по правилам</title>
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f2; --surface: #ffffff; --surface-2: #f0f3ee; --border: #e1e6dd; --text: #1b211c; --muted: #66705f;
  --green: #127c40; --green-hover: #0f6935; --green-soft: #e2f3e8; --on-green: #ffffff;
  --orange: #e8710a; --orange-soft: #fff0df; --orange-text: #b45309; --on-orange: #2a1300;
  --shadow: 0 1px 2px rgb(20 30 20 / .05), 0 8px 24px rgb(20 30 20 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d110e; --surface: #151b16; --surface-2: #1c241d; --border: #263027; --text: #e6ece5; --muted: #8f9c8f;
    --green: #34c172; --green-hover: #4ad485; --green-soft: rgb(52 193 114 / .14); --on-green: #06210f;
    --orange: #ff9838; --orange-soft: rgb(255 152 56 / .16); --orange-text: #ffb066; --on-orange: #2a1300;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d110e; --surface: #151b16; --surface-2: #1c241d; --border: #263027; --text: #e6ece5; --muted: #8f9c8f;
  --green: #34c172; --green-hover: #4ad485; --green-soft: rgb(52 193 114 / .14); --on-green: #06210f;
  --orange: #ff9838; --orange-soft: rgb(255 152 56 / .16); --orange-text: #ffb066; --on-orange: #2a1300;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .25);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background .2s, color .2s; }
main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 56px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--green), var(--orange)); color: #fff; flex: none; }
header h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.titles { flex: 1; min-width: 220px; }
.theme { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.theme button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--green-soft); color: var(--green); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.count { background: var(--orange); color: var(--on-orange); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; line-height: 20px; }

.setup { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; }
.field-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  min-height: 168px; padding: 18px; border: 2px dashed var(--border); border-radius: 14px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--green); background: var(--green-soft); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop svg { color: var(--green); }
.drop strong { font-size: 15px; word-break: break-word; }
.drop span { color: var(--muted); font-size: 13px; }
.drop.has-file { border-style: solid; border-color: var(--green); }
textarea { width: 100%; min-height: 168px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); resize: vertical; line-height: 1.6; }
textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
.primary { display: inline-flex; align-items: center; gap: 8px; background: var(--green); color: var(--on-green); border: 0; border-radius: 10px; padding: 11px 22px; font-weight: 600; transition: background .15s, transform .05s; }
.primary:hover:not(:disabled) { background: var(--green-hover); }
.primary:active:not(:disabled) { transform: translateY(1px); }
.primary:disabled { opacity: .45; cursor: default; }
.primary.stop { background: var(--orange); color: var(--on-orange); }
.secondary { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; }
.secondary:hover { border-color: var(--green); color: var(--green); }
.status-box { flex: 1; min-width: 220px; }
#status { margin: 0; color: var(--muted); font-size: 14px; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.progress[hidden] { display: none; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--orange)); border-radius: inherit; transition: width .3s; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; margin-top: 20px; align-items: start; }
.layout[hidden] { display: none; }
#text { font-size: 16px; line-height: 1.75; }
#text p { margin: 0; padding: 6px 10px; border-radius: 10px; border-left: 3px solid transparent; transition: background .2s; }
#text p.now { background: var(--green-soft); border-left-color: var(--green); }
#text .time { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); background: none; border: 0; padding: 0 10px 0 0; vertical-align: 1px; }
#text .time:hover { color: var(--green); }
#text .failed { color: var(--orange-text); }
#text .empty { color: var(--muted); padding: 24px 10px; text-align: center; border: 0; }
mark { background: var(--orange-soft); color: inherit; border-bottom: 2px solid var(--orange); border-radius: 4px; padding: 1px 3px; cursor: pointer; transition: background .15s, color .15s; }
mark:hover { background: color-mix(in srgb, var(--orange) 30%, transparent); }
mark.active { background: var(--orange); color: var(--on-orange); }

aside { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
#findings { list-style: none; margin: 0 -8px; padding: 0; max-height: 46vh; overflow-y: auto; }
#findings li { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; padding: 10px; margin: 0 0 4px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s; }
#findings li:hover { background: var(--surface-2); }
#findings li.active { background: var(--orange-soft); border-color: var(--orange); }
#findings li.none { display: block; color: var(--muted); cursor: default; text-align: center; padding: 16px; }
#findings li.none:hover { background: none; }
#findings .time { font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--orange-text); background: var(--orange-soft); border-radius: 6px; padding: 2px 6px; align-self: start; }
#findings .quote { font-weight: 600; }
#findings .rule { grid-column: 2; font-size: 12px; color: var(--green); font-weight: 600; }
#findings .reason { grid-column: 2; font-size: 13px; color: var(--muted); }
#player video, #player audio { width: 100%; display: block; }
#player video { max-height: 260px; background: #000; border-radius: 10px; }

@media (max-width: 900px) {
  .setup, .layout { grid-template-columns: 1fr; }
  aside { position: static; order: -1; }
  #findings { max-height: 40vh; }
}
</style>
<main>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h2M7 8v8M11 4v16M15 8v8M19 11v2"/></svg>
  </div>
  <div class="titles">
    <h1>Проверка аудио и видео</h1>
    <p>Whisper переводит речь в текст, Gemma проверяет его по вашим правилам.</p>
  </div>
  <div class="theme" role="group" aria-label="Тема">
    <button type="button" data-theme="auto">Авто</button>
    <button type="button" data-theme="light">Светлая</button>
    <button type="button" data-theme="dark">Тёмная</button>
  </div>
</header>

<section class="card">
  <div class="setup">
    <div>
      <span class="field-label">Файл</span>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="audio/*,video/*">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <strong id="file-name">Перетащите аудио или видео</strong>
        <span id="file-hint">или нажмите, чтобы выбрать · MP3, WAV, M4A, MP4, WEBM</span>
      </label>
    </div>
    <div>
      <label class="field-label" for="rules">Правила — по одному на строку</label>
      <textarea id="rules" spellcheck="false"></textarea>
      <p class="hint">Пишите своими словами, можно с примерами: «Курение (курю, сигареты)». Модель понимает смысл, а не только точные слова.</p>
    </div>
  </div>
  <div class="actions">
    <button id="run" class="primary" type="button" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <span>Проверить</span>
    </button>
    <button id="report" class="secondary" type="button" hidden>Скачать отчёт (.txt)</button>
    <div class="status-box">
      <p id="status" role="status" aria-live="polite">Выберите файл.</p>
      <div class="progress" id="progress" hidden><span></span></div>
    </div>
  </div>
</section>

<div class="layout" id="layout" hidden>
  <section class="card">
    <h2>Текст</h2>
    <div id="text"></div>
  </section>
  <aside>
    <section class="card">
      <h2>Нарушения <span class="count" id="count">0</span></h2>
      <ul id="findings"></ul>
    </section>
    <section class="card" id="player">
      <h2>Плеер</h2>
    </section>
  </aside>
</div>
</main>
<script type="module" src="/check.js"></script>
</html>
