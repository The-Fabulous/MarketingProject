<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketingProject — расшифровка голоса</title>
<style>
body { font: 16px system-ui, sans-serif; margin: 48px auto; padding: 0 20px; max-width: 720px; color: #222; }
h1 { font-size: 24px; } button, select { font: inherit; padding: 10px; } textarea { box-sizing: border-box; width: 100%; min-height: 240px; padding: 12px; font: inherit; } label { display: block; margin: 24px 0 8px; } #status { min-height: 24px; } button { cursor: pointer; }
</style>
<main>
<h1>Расшифровка голоса</h1>
<p>Нажмите кнопку, произнесите текст и остановите запись. Максимум 2 минуты.</p>
<button id="record" type="button">Начать ввод микрофоном</button>
<p id="status" role="status" aria-live="polite">Готово к записи.</p>
<label for="transcript">Текстовая расшифровка</label>
<textarea id="transcript" readonly placeholder="Здесь появится текст вашей записи"></textarea>
</main>
<script type="module" src="/app.js"></script>
</html>
